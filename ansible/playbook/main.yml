---
- name: "Phase1: Common tasks for all nodes"
  hosts: cluster-nodes
  become: true
  gather_facts: true
  roles:
    - pre-requisites-role
    - container-runtime-role
    - k8s-installation-role

- name: "Phase2: Master node tasks"
  hosts: control-node
  become: true
  gather_facts: true
  roles:
    - master-role

- name: "Phase3: Worker node tasks"
  hosts: worker-nodes
  become: true
  gather_facts: true
  roles:
    - worker-role
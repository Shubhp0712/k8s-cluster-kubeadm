---
# tasks file for worker-role
- name: "Check and Stop kubelet if running on workers"
  ansible.builtin.systemd:
    name: kubelet
    state: stopped

- name: "Join the worker node to the cluster"
  become: true
  block:
    - name: "Check whether node is already joined to the cluster"
      ansible.builtin.stat:
        path: "{{ kubelet_config_path }}"
      register: kubelet_config_stat

    - name: "Join the worker node to the cluster"
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['control-node'][0]]['join_command']['stdout'] }}"
      when: kubelet_config_stat.stat.exists == false